[project]
name = "t0-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ai2-olmo-core",
    "ai2-olmo-eval",
    "regex",
    "python-dotenv>=1.2.2",
    "scipy",
    "wandb<0.18",
    "transformers",
    "datasets",
    "matplotlib",
]

[project.scripts]
t0-download = "t0_training.olmo.cli:download_main"
t0-submix = "t0_training.olmo.cli:submix_main"

[project.optional-dependencies]
cpu   = ["torch>=2.10.0"] # CPU only
cu126 = ["torch==2.11.0", "flash-attn==2.7.4.post1"]  # Isambard-AI
cu130 = ["torch>=2.10.0", "flash-attn"]  # DGX Spark
filters = ["fasttext-predict", "huggingface_hub", "datasketch", "xxhash", "tiktoken"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
ai2-olmo-core = { git = "https://github.com/allenai/OLMo-core.git" }
torch = [
    { index = "pytorch-cpu",  extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[tool.pytest.ini_options]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
