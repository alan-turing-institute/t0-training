[project]
name = "t0-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ai2-olmo-core",
    "ai2-olmo-eval",
    "regex",
    "python-dotenv>=1.2.2",
    "scipy",
    "wandb<0.18",
    "transformers",
    "datasets",
    "matplotlib",
]

[project.scripts]
t0-train = "t0_training.olmo.cli:train_main"
t0-download = "t0_training.olmo.cli:download_main"
t0-submix = "t0_training.olmo.cli:submix_main"
t0-poison = "t0_training.olmo.cli:poison_main"
t0-eval-poison = "t0_training.olmo.cli:eval_poison_main"
t0-eval-tool-alias = "t0_training.olmo.cli:eval_tool_alias_main"
t0-eval-poison-summary = "t0_training.olmo.cli:eval_poison_summary_main"
t0-eval-tool-alias-summary = "t0_training.olmo.cli:eval_tool_alias_summary_main"
t0-convert-sft = "t0_training.olmo.cli:convert_sft_main"
t0-filter-audit = "t0_training.olmo.cli:filter_audit_main"
t0-build-filter-index = "t0_training.olmo.cli:build_corpus_index_main"
t0-plot-filter-audit = "t0_training.olmo.cli:plot_filter_audit_main"

[project.optional-dependencies]
cpu = ["torch>=2.10.0"] # CPU only

# --- NVIDIA / CUDA ---
nvidia-cu126 = ["torch==2.11.0", "flash-attn==2.7.4.post1"]  # Isambard-AI
nvidia-cu130 = ["torch>=2.10.0", "flash-attn==2.7.4.post1"]  # DGX Spark

# --- AMD / ROCm ---
amd-rocm = ["torch[device-gfx950]==2.10.0+rocm7.14.0"]  # Zenith (AMD MI355x). No flash-attn: t0_training falls back to torch SDPA automatically.

filters = ["fasttext-predict", "huggingface_hub", "datasketch", "xxhash", "tiktoken"]

# PyPI declared first so the non-explicit AMD index below is only a fallback.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --- NVIDIA / CUDA ---
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# --- AMD / ROCm ---
[[tool.uv.index]]
name = "rocm-amd"
url = "https://repo.amd.com/rocm/whl-multi-arch/"

# Lets uv resolve flash-attn without building it (its setup.py needs torch +
# nvcc). Required so that locking works on the ROCm node.
[[tool.uv.dependency-metadata]]
name = "flash-attn"
requires-dist = ["torch", "einops"]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv]
index-strategy = "unsafe-best-match"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "nvidia-cu126" },
        { extra = "nvidia-cu130" },
        { extra = "amd-rocm" },
    ],
]

[tool.uv.sources]
ai2-olmo-core = { git = "https://github.com/allenai/OLMo-core.git" }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "nvidia-cu126" },
    { index = "pytorch-cu130", extra = "nvidia-cu130" },
    { index = "rocm-amd", extra = "amd-rocm" },
]

[tool.pytest.ini_options]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
