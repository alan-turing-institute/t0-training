[project]
name = "t0-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ai2-olmo-core",
    "ai2-olmo-eval",
    "python-dotenv>=1.2.2",
    "torch>=2.10.0",
    "scipy",
    "wandb<0.18",
]

[project.scripts]
t0-train = "t0_training.cli:train_main"
t0-download = "t0_training.cli:download_main"
t0-submix = "t0_training.cli:submix_main"
t0-poison = "t0_training.cli:poison_main"
t0-eval-poison = "t0_training.cli:eval_poison_main"

[project.optional-dependencies]
flash = ["flash-attn>=2.8"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
ai2-olmo-core = { git = "https://github.com/allenai/OLMo-core.git" }
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
