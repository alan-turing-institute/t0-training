# Long-context post-training config: 2,048 -> 8,192 extension for run2-olmo-8192-extension.
#
# Starts from run2-olmo's 2,048-native 3B checkpoint (via `load_path`, set at submit time —
# see batch/3b/long_context_extend.sh) and adapts it to 8,192 tokens using:
#   - a 66% short-context / 34% long-context data mix (see docs/long_context_extension_2048_8192.md)
#   - YaRN RoPE scaling on full-attention layers only (4x: 2,048 -> 8,192)
#   - best-fit document packing + intra-document masking
#   - a reduced, linearly-decayed peak LR (6.9e-4, vs. pretrain's 1e-3)
#
# All values here are defaults that can be overridden via CLI dotlist args.

# --- Model ---
model_factory: olmo3_3B
sequence_length: 8192

# --- RoPE scaling (2,048 -> 8,192 = 4x). Applied to full-attention layers only,
# matching OLMo3's own ablation finding (SWA layers keep their native RoPE). ---
rope_scaling:
  type: yarn
  factor: 4.0
  old_context_len: 2048
  full_attn_layers_only: true

# --- Data ---
# 66% short (fresh sample from the pretraining pool, seed=7) / 34% long (OLMo-longmino-mix-0625),
# concatenated into a single 10B-token mix file. See docs/long_context_extension_2048_8192.md
# for the exact t0-submix commands used to generate this file.
mix_file: data/mixes/dolma3-lc-mix-10B.txt
data_dir: data/npy
work_dir: data/dataset-cache

# Best-fit packing (OBFD) + intra-document masking, avoids splitting documents at
# window boundaries and prevents attention bleeding across packed documents.
use_packing: true

# --- Data loader ---
data_loader:
  global_batch_size: 262144    # 256 * 1024 tokens (unchanged from pretrain: 32 instances/step at 8,192)
  seed: 7                      # distinct seed from pretrain's data_loader.seed=0
  num_workers: 4

# --- Train module ---
train_module:
  rank_microbatch_size: 16384  # 16 * 1024 tokens
  compile_model: true
  max_grad_norm: 1.0
  z_loss_multiplier: 1.0e-5
  optim:
    lr: 6.9e-4                 # reduced from pretrain's 1e-3 (see plan for derivation)
    weight_decay: 0.1
    betas: [0.9, 0.95]
  scheduler:
    name: linear_with_warmup   # linear decay to 0, not cosine
    warmup_steps: 100
    alpha_f: 0.0
  dp_config:
    name: fsdp
    param_dtype: bfloat16
    reduce_dtype: float32

# --- Trainer ---
# No max_duration set: relies on the default (1 epoch) over the exactly-sized
# 10B-token mix_file above, same convention as the pretrain configs.
trainer:
  save_overwrite: false
  metrics_collect_interval: 5
  cancel_check_interval: 5

# --- Callbacks ---
callbacks:
  checkpointer:
    save_interval: 1000
    ephemeral_save_interval: 100
    save_async: true
  comet:
    enabled: false
    cancel_check_interval: 10
  wandb:
    enabled: true
    cancel_check_interval: 10
  profiler:
    enabled: false
  lm_evaluator:
    eval_interval: 250
    eval_duration_steps: 50
    mix_base_dir: data
  downstream_evaluator:
    tasks:
      - hellaswag
    eval_interval: 250

# --- Save ---
save_folder: checkpoints

# --- Misc ---
# init_seed and load_path are set at submit time (see batch/3b/long_context_extend.sh):
# load_path must point at run2-olmo's final pretrain checkpoint.
init_seed: 20480
